# 查询侧语义映射（query-side synonyms）—— kb_search.py 使用
#
# 为什么手写而不是上嵌入模型（实测依据见 _tools/检索规范.md §4.5）：
#   我们的短板是"同一个意思、换了说法"（B 组自然语句 r@5 = 0/7）：客户不续费 → 流失率；
#   合同里出问题谁担责 → 责任上限/赔偿。这类映射**数量有限、领域内可枚举**，
#   手写一份 30–60 条的映射，既免依赖、又可评审、还能被人工迭代修正 —— 比装一个嵌入模型更可控。
#
# 规则：
#   1. 键 = 用户/agent 可能说的词（口语、近义、上位词）；值 = **知识库里真实存在的词/术语**（写前用 kb_search 验过）
#   2. 只在查询侧展开（不动文档、不加索引），权重低于词面命中 —— 命不准顶多排后，不会压过精确匹配
#   3. 只写**领域内可枚举**的映射；开放领域语义（"这个行业的未来"）交给 agent 侧改写，不硬塞这里
#   4. 新增前先跑 `kb_eval.py`，B 组要升、D 组负样本必须保持 0 命中

maps:
  # —— 客户与留存 ——
  续费: [流失, 留存, 流失率, 续约, churn, retention]
  不续费: [流失, 流失率, churn]
  客户跑了: [流失, 流失率, churn]
  留存: [流失率, retention, 单位经济]
  # —— 收钱与计费 ——
  要钱: [计费, 收款, 报价, 定价, 付款]
  分几次收: [付款, 里程碑, 分期, 计费]
  怎么收钱: [定价, 计费, 计费模型]
  涨价: [定价, 价格, 定价策略]
  降价: [成本, 定价, 价格战, 定价策略]
  # —— 合同与责任 ——
  担责: [责任, 责任上限, 赔偿, 责任限额, liability]
  出问题谁负责: [责任上限, 赔偿, 责任限额, 免责]
  免责: [责任上限, 责任限额, 赔偿, liability]
  成果归谁: [知识产权, IP, 归属, 交付物归属, intellectual]
  版权: [知识产权, IP, 归属]
  # —— 接活与范围 ——
  接活: [服务范围, 项目范围, 服务报价, 单位经济]
  该不该接: [服务范围, 单位经济, 报价, 价值]
  活儿: [服务范围, 项目范围, 交付]
  # —— 获客 ——
  找客户: [获客, 线索, 渠道, 增长]
  第一批客户: [获客, 线索, 冷启动]
  拉客户: [获客, 线索, 渠道]
  # —— 模型与工程（code/content 也会用到）——
  # —— 第二轮补齐（实测 B 组剩余失败项）——
  担责: [责任, 赔偿, 限额, 责任上限, liability]
  谁负责: [责任, 赔偿, 限额]
  该不该接: [服务范围, 单位经济, 报价, 价值, 交付]
  接不接: [服务范围, 报价, 价值]
  报价影响: [定价, 定价策略, 成本, 单位经济]
  成本上涨: [定价, 成本, 定价策略]
  跑偏: [长任务, Harness, 目标漂移, 上下文, 循环]
  忘了目标: [长任务, 目标, 上下文, Harness]
  省 token: [上下文工程, 上下文治理, 工具规模]
  验证: [评测, 测试, 验证闭环, review]
  会不会幻觉: [评测, 事实核查, 护栏]
